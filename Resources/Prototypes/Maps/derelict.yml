- type: gameMap
  id: Derelict
  mapName: 'Derelict'
  mapPath: /Maps/derekict.yml
  minPlayers: 15
  maxPlayers: 60
  stations:
    Arena:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} The Derelict Project {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DV'
        #- type: StationEmergencyShuttle
        #  emergencyShuttlePath: /Maps/_DV/Shuttles/Evac/ntes_uclb.yml
        #- type: StationCargoShuttle
        #  path: /Maps/_DV/Shuttles/Cargo/ntcs_duster.yml
        - type: StationJobs
          availableJobs:
          #civilian
            Passenger: [ 2, 4 ]
            Librarian: [ 1, 1 ]
          #command
            Captain: [ 1, 1 ]
            StationAi: [ 1, 1 ]
          #engineering
            AtmosphericTechnician: [ 1, 2 ]
            ChiefEngineer: [ 1, 1 ]
            Foreman: [ 5, 5 ]
            StationEngineer: [ 5, 10 ]
            TechnicalAssistant: [ -1, -1 ] #Overflow jobs
          #justice
            ChiefJustice: [ 1, 1 ]
            Clerk: [ 1, 1 ]
            Lawyer: [ 2, 2 ]
            Prosecutor: [ 1, 1 ]
          #medical
            Chemist: [ 2, 2 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            MedicalDoctor: [ 3, 4 ]
            MedicalIntern: [ 2, 2 ]
            Paramedic: [ 2, 2 ]
            Psychologist: [ 1, 1 ]
            #Surgeon: [ 1, 1 ] Temporarily removed until it returns
          #security
            Brigmedic: [ 1, 1 ]
            Detective: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            Prisoner: [ 2, 2 ]
            PrisonGuard: [ 1, 1 ]
            SecurityOfficer: [ 5, 7 ]
            SecurityCadet: [ 2, 2 ]
            Warden: [ 1, 1 ]
          #service
            Bartender: [ 1, 2 ]
            Botanist: [ 2, 2 ]
            Chef: [ 2, 2 ]
            Clown: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            Janitor: [ 2, 2 ]
            Mime: [ 1, 1 ]
            Musician: [ 2, 2 ]
            Reporter: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
          #science
            Chaplain: [ 1, 1 ]
            ForensicMantis: [ 1, 1 ]
            ResearchAssistant: [ 2, 2 ]
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 4, 5 ]
            Roboticist: [ 1, 1 ]
          #supply
            CargoAssistant: [ 2, 2 ]
            CargoTechnician: [ 3, 4 ]
            Courier: [ 2, 2 ]
            SalvageSpecialist: [ 2, 3 ]
            Quartermaster: [ 1, 1 ]
            #Supply Borg [ 2, 2 ]
